name: PR Unit Tests

on:
  pull_request:
    branches: [ main ]

jobs:

  # ── Spring Boot (Maven) ──────────────────────────────────────────────────────
  spring-unit-tests:
    name: Spring Boot Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        working-directory: subscription-insight-service
        run: mvn test -B

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spring-surefire-report
          path: subscription-insight-service/target/surefire-reports/
          retention-days: 7

  # ── Python / FastAPI (pytest) ────────────────────────────────────────────────
  python-unit-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: subscription-insight-engine/requirements.txt

      - name: Install dependencies
        working-directory: subscription-insight-engine
        run: pip install -r requirements.txt

      - name: Run unit tests
        working-directory: subscription-insight-engine
        run: pytest tests/unit -v --tb=short --junitxml=test-results/junit.xml

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-pytest-report
          path: subscription-insight-engine/test-results/
          retention-days: 7
